name: Tag Tempo Health Release

on:
  push:
    branches:
      - health/v0.1-foundation
    paths:
      - 'health-build.txt'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Créer le tag de version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < release-version.txt)"
          test -n "$VERSION" || (echo "Version vide" && exit 1)

          TAG="health-v$VERSION"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG existe déjà"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
