name: Vérifier Tempo Coach

on:
  push:
    branches:
      - 'health/v2.4.2-stats-detaillees'
      - 'health/v2.5.6-semantic-colors'
      - 'health/v2.5.7-accueil-semantic-colors'

permissions:
  contents: read
  issues: write

jobs:
  compilation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Installer Android 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Compiler Android
        id: compile
        continue-on-error: true
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug -PVERSION_NAME=2.5.7 -PVERSION_CODE=20507
      - name: Envoyer le résultat au ticket de validation
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ steps.compile.outcome }}';
            const label = result === 'success' ? '✅ Tests JUnit et compilation debug réussis' : '❌ Tests JUnit ou compilation debug échoués';
            const link = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `${label} pour \`${context.sha.slice(0,10)}\` — [journal GitHub Actions](${link}).`
            });
      - name: Validation
        if: steps.compile.outcome != 'success'
        run: exit 1
